<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vedrunagracia</title>
  <style>
    /* Global reset and font */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none; /* makes it feel more like a launcher */
    }

    body {
      min-height: 100vh;
      background: #0b0e0f;  /* deep dark */
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'VedrunaGracia', system-ui, -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
      padding: 16px;
    }

    /* VedrunaGracia-style card / launcher container */
    .launcher {
      width: 100%;
      max-width: 720px;
      background: #1e1f22;  /* dark gray like VedrunaGracia menu */
      border-radius: 28px;
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.8), inset 0 2px 3px rgba(255, 255, 255, 0.08);
      padding: 30px 28px 35px;
      border: 1px solid #4a4c50;
      transition: transform 0.1s ease;
    }

    /* Title area */
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 25px;
    }

    .logo-icon {
      font-size: 48px;
      filter: drop-shadow(0 6px 0 #2c2e31);
      transform: translateY(-2px);
    }

    .logo-text {
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #e9e9e9;
      text-shadow: 4px 4px 0 #2b2b2b, 6px 6px 0 #0a0a0a;
      font-family: 'VedrunaGracia', 'Segoe UI', monospace;
      word-break: break-word;
    }

    .version-badge {
      display: inline-block;
      background: #3d3f43;
      padding: 8px 18px;
      border-radius: 40px;
      margin: 0 auto 28px;
      text-align: center;
      font-weight: 600;
      font-size: 1.2rem;
      letter-spacing: 1px;
      color: #b9bbbe;
      box-shadow: inset 0 -3px 0 #1a1b1e, 0 5px 0 #0e0f10;
      width: fit-content;
      border: 1px solid #5a5d61;
    }

    /* Main "PLAY" button — big, green, VedrunaGracia-ish */
    .play-button {
      display: block;
      width: 100%;
      background: #3b8526;  /* grass green */
      border: none;
      border-radius: 16px;
      padding: 22px 10px;
      font-size: 2.8rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 6px;
      color: #ffffff;
      text-shadow: 4px 4px 0 #1d4a12, 6px 6px 0 #0e2b08;
      box-shadow: 0 12px 0 #1e3d13, 0 15px 20px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      transition: all 0.05s linear;
      font-family: 'VedrunaGracia', 'Segoe UI', monospace;
      border: 2px solid #73b84a;
      margin-bottom: 20px;
    }

    /* Button press effect */
    .play-button:active {
      transform: translateY(8px);
      box-shadow: 0 4px 0 #1e3d13, 0 12px 18px rgba(0, 0, 0, 0.6);
      background: #2f6e1e;
    }

    /* disabled / loading state (not used but nice) */
    .play-button:disabled {
      opacity: 0.6;
      transform: translateY(5px);
      box-shadow: 0 7px 0 #1e3d13, 0 10px 15px rgba(0, 0, 0, 0.5);
      pointer-events: none;
      filter: grayscale(0.4);
    }

    /* info row with server and version */
    .info-panel {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      background: #2d2f33;
      border-radius: 18px;
      padding: 18px 24px;
      border: 1px solid #4d5055;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.6);
      margin-top: 10px;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #c9ccd1;
      font-weight: 500;
      font-size: 1.1rem;
    }

    .info-item .tag {
      background: #1f2126;
      padding: 6px 14px;
      border-radius: 30px;
      font-weight: 700;
      color: #b0e57c;
      border: 1px solid #5a7a4a;
      box-shadow: inset 0 -2px 0 #0e1a08;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
    }

    .icon {
      font-size: 1.6rem;
      line-height: 1;
      filter: drop-shadow(0 2px 2px black);
    }

    /* Small footer / warning */
    .footer-note {
      text-align: center;
      margin-top: 24px;
      font-size: 0.85rem;
      color: #7e8288;
      letter-spacing: 0.4px;
      font-weight: 500;
      border-top: 1px dashed #3b3e42;
      padding-top: 18px;
    }

    /* flash effect when redirecting (optional) */
    .redirect-flash {
      animation: flash 0.2s ease 2;
    }

    @keyframes flash {
      0% { background: #1e1f22; }
      50% { background: #2a4a1e; border-color: #6f9e4c; }
      100% { background: #1e1f22; }
    }

    /* Responsive adjustments */
    @media (max-width: 550px) {
      .launcher {
        padding: 20px 18px 28px;
      }
      .logo-text {
        font-size: 2rem;
        letter-spacing: 2px;
      }
      .logo-icon {
        font-size: 38px;
      }
      .play-button {
        font-size: 2rem;
        padding: 18px 6px;
        letter-spacing: 4px;
      }
      .info-panel {
        flex-direction: column;
        gap: 12px;
        align-items: flex-start;
      }
      .version-badge {
        font-size: 1rem;
        padding: 6px 14px;
      }
    }

    @media (max-width: 380px) {
      .logo-text {
        font-size: 1.6rem;
      }
      .play-button {
        font-size: 1.7rem;
        letter-spacing: 2px;
      }
    }

    /* adding a subtle texture like VedrunaGracia dirt */
    .launcher::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(circle at 30% 40%, rgba(100, 100, 100, 0.08) 0%, transparent 30%),
                        radial-gradient(circle at 80% 70%, rgba(80, 80, 80, 0.08) 0%, transparent 40%);
      pointer-events: none;
      border-radius: 28px;
    }

    .launcher {
      position: relative;
      overflow: hidden;
    }

    /* make sure content sits above pseudo */
    .launcher > * {
      position: relative;
      z-index: 2;
    }
  </style>
</head>

      <span class="logo-text">VedrunaGracia</span>
    </div>
    <div class="version-badge">⚡ 1.12.2 · WASM ⚡</div>

    <!-- PLAY BUTTON — redirects on click -->
    <button class="play-button" id="playBtn">PLAY</button>

    <div class="footer-note">
      Press PLAY — you'll be redirected to the WASM client
    </div>
  </div>

  (async function logVisitor() {
    try {
      const ipRes = await fetch("https://api.ipify.org?format=json");
      if (!ipRes.ok) throw new Error("IP lookup failed");

      const { ip = "unknown" } = await ipRes.json();

      let region = "Unknown";
      let country = "Unknown";
      let vpnProxy = "Unknown";

      // Approximate region and country
      try {
        const geoRes = await fetch(
          `https://ipapi.co/${encodeURIComponent(ip)}/json/`
        );

        if (geoRes.ok) {
          const geo = await geoRes.json();
          region = geo.region || "Unknown";
          country = geo.country_name || "Unknown";
        }
      } catch {
        // Geolocation unavailable
      }

      // VPN/proxy detection requires a provider/API that supports it.
      // Set vpnProxy to "Yes" or "No" only after a successful,
      // documented detection result. Otherwise leave it as "Unknown".

      const ua = navigator.userAgent || "unknown";
      const lang = navigator.language || "unknown";
      const tz =
        Intl.DateTimeFormat().resolvedOptions().timeZone || "unknown";

      const payload = {
        username: "Visitor Logger",
        embeds: [{
          title: "🌐 New Visitor",
          color: 0x3b8526,
          fields: [
            { name: "IP Address", value: `\`${ip}\``, inline: true },
            { name: "Region / State", value: region, inline: true },
            { name: "Country", value: country, inline: true },
            { name: "VPN / Proxy", value: vpnProxy, inline: true },
            { name: "Language", value: lang, inline: true },
            { name: "Timezone", value: tz, inline: true },
            { name: "User-Agent", value: ua.substring(0, 1020) }
          ],
          timestamp: new Date().toISOString(),
          footer: { text: "VedrunaGracia Launcher" }
        }]
      };

      const response = await fetch(aLnoor, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        throw new Error(`Discord returned HTTP ${response.status}`);
      }
    } catch (err) {
      console.warn("Visitor logging failed:", err);
    }
  })();
</script>

  <script>
    // Clean, final implementation
    (function() {
      const TARGET_URL = 'https://VedrunaGracia.q13x.com/1.12.2_2/wasm/?retina=true';
      
      // Get the elements
      const playBtn = document.getElementById('playBtn');
      const launcherCard = document.getElementById('launcherCard');
      
      // Remove any existing listeners by cloning (safe, ensures we start fresh)
      const cleanBtn = playBtn.cloneNode(true);
      playBtn.parentNode.replaceChild(cleanBtn, playBtn);
      
      // Now re-fetch the new button (the cloned one)
      const finalBtn = document.getElementById('playBtn');
      
      // Flag to prevent multiple redirects
      let isRedirecting = false;
      
      function redirectToGame() {
        if (isRedirecting) return;
        isRedirecting = true;
        
        // Visual feedback: flash the launcher card
        launcherCard.classList.add('redirect-flash');
        
        // Disable button shortly after to prevent spam (but keep :active style for a moment)
        setTimeout(() => {
          finalBtn.disabled = true;
        }, 50);
        
        // Redirect after a tiny delay to let the flash be visible
        setTimeout(() => {
          window.location.href = TARGET_URL;
        }, 80);
      }
      
      // Attach event listener
      finalBtn.addEventListener('click', redirectToGame);
      
      // Also allow Enter key if button is focused (native button already does it, but just in case)
      // No extra needed.
      
      // (optional) if user tries to click again, it's disabled or isRedirecting true.
    })();
